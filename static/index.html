<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M16 6l7 14-7-4-7 4z' fill='%234dd6ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><b>$</b><b>€</b><b>₩</b><b>£</b><b>¥</b></div>
  <div id="banner" class="banner" hidden></div>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l8.5 17-8.5-4.8L7.5 21z"/></svg>
      <span class="brand-name">APPLICATION TRACKER</span>
    </a>
    <nav class="nav" role="tablist" aria-label="Views">
      <a href="#/map"       data-view="map"       role="tab">Map</a>
      <a href="#/dashboard" data-view="dashboard" role="tab">Dashboard</a>
      <a href="#/pipeline"  data-view="pipeline"  role="tab">Pipeline</a>
      <a href="#/insights"  data-view="insights"  role="tab">Insights</a>
      <a href="#/prep"      data-view="prep"      role="tab">Prep</a>
    </nav>
    <div class="topbar-right">
      <button class="ghost-btn" id="palette-btn" title="Command palette">⌘K</button>
      <button class="ghost-btn icon-btn" id="music-btn" title="Toggle music" aria-label="Toggle background music"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5V3.8l7-1.3v8.7"/><circle cx="3.9" cy="12.6" r="1.7"/><circle cx="10.9" cy="11.3" r="1.7"/></svg></button>
      <button class="ghost-btn icon-btn" id="sound-btn" title="Toggle sound effects" aria-label="Toggle sound effects"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2v3.6h2.4l3.3 2.8V3.4L4.9 6.2H2.5z" fill="currentColor" stroke="none"/><path d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8"/><path d="M12.4 3.8a6 6 0 0 1 0 8.4"/></svg></button>
      <button class="ghost-btn icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13V1.5z"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="accent-btn" id="new-btn" title="New application (N)">+ New</button>
    </div>
  </header>

  <main id="views">
    <section id="view-dashboard" class="view container" hidden></section>
    <section id="view-pipeline"  class="view view-wide" hidden></section>
    <section id="view-map"       class="view view-full" hidden></section>
    <section id="view-insights"  class="view container" hidden></section>
    <section id="view-prep"      class="view container" hidden></section>
  </main>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/Flip.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
