name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No workbooks or runtime data in the repo
        run: |
          leaks=$(git ls-files | grep -E '\.xlsx$|^data/' || true)
          if [ -n "$leaks" ]; then
            echo "::error::Private data must never be committed:"
            echo "$leaks"
            exit 1
          fi
