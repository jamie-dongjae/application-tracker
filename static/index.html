<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M16 6l7 14-7-4-7 4z' fill='%234dd6ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l8.5 17-8.5-4.8L7.5 21z"/></svg>
      <span class="brand-name">APPLICATION TRACKER</span>
    </a>
    <nav class="nav" role="tablist" aria-label="Views">
      <a href="#/dashboard" data-view="dashboard" role="tab">Dashboard</a>
      <a href="#/pipeline"  data-view="pipeline"  role="tab">Pipeline</a>
      <a href="#/map"       data-view="map"       role="tab">Map</a>
      <a href="#/insights"  data-view="insights"  role="tab">Insights</a>
      <a href="#/prep"      data-view="prep"      role="tab">Prep</a>
    </nav>
    <div class="topbar-right">
      <button class="ghost-btn" id="palette-btn" title="Command palette">⌘K</button>
      <button class="ghost-btn" id="music-btn" title="Toggle music" aria-label="Toggle background music">♫</button>
      <button class="ghost-btn" id="sound-btn" title="Toggle sound effects" aria-label="Toggle sound effects">♪</button>
      <button class="ghost-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button class="accent-btn" id="new-btn" title="New application (N)">+ New</button>
    </div>
  </header>

  <main id="views">
    <section id="view-dashboard" class="view container" hidden></section>
    <section id="view-pipeline"  class="view view-wide" hidden></section>
    <section id="view-map"       class="view view-full" hidden></section>
    <section id="view-insights"  class="view container" hidden></section>
    <section id="view-prep"      class="view container" hidden></section>
  </main>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
