[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-tracker"
version = "1.1.0"
description = "Local-first job application tracker: paste a posting URL, everything else is prefilled. Excel backend, accurate map, zero cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "openpyxl>=3.1",
    "httpx>=0.26",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
